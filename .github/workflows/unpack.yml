name: Unpack uploaded source

# One-time helper: the first upload was a zip (the web uploader can't keep folders).
# This unpacks it into the repo and removes the zip. Safe to delete afterwards.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          [ -f source.zip ] || exit 0
          unzip -o source.zip -d .
          git rm -q source.zip
          git config user.name "Leymo0"
          git config user.email "Leymo0@users.noreply.github.com"
          git add -A
          git commit -m "Add PokeRPGLink source"
          git push
